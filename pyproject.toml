[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "skycolour"
version = "0.1.0"
description = "Retrieve aerosol load from sunset and sunrise photo sequences (colour index vs air mass)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lisa" }]
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "matplotlib>=3.7", "Pillow>=10.0", "exifread>=3.0"]

[project.optional-dependencies]
raw = ["rawpy>=0.19"]
dev = ["pytest>=7.0", "pvlib>=0.10", "tabulate>=0.9"]

[project.scripts]
skycolour = "skycolour.cli:main"

[tool.setuptools]
packages = ["skycolour"]

[tool.pytest.ini_options]
testpaths = ["tests"]
